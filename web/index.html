<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>harnessblender</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="topbar">
    <h1>harnessblender</h1>
    <nav id="tabs">
      <button class="tab active" data-tab="recipes" type="button">Recipes</button>
      <button class="tab" data-tab="drinkers" type="button">Drinkers</button>
    </nav>
    <input id="filter" type="text" placeholder="filter ingredients…" autocomplete="off" />
    <div id="blacklist" class="chipgroup">
      <span class="tlabel">exclude</span>
      <div id="bl-chips"></div>
      <input id="bl-input" type="text" placeholder="dir + enter" autocomplete="off" />
    </div>
  </header>

  <div id="table-wrap">
    <table id="matrix"></table>
  </div>

  <div id="drinkers-view" class="hidden">
    <div id="drinkers-cards"></div>
  </div>

  <div id="toast" class="hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
